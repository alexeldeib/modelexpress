# vLLM + ModelExpress P2P for Kimi-K2.5-NVFP4 (TP=4, 4 GPUs per replica).
# Tests P2P weight transfer at scale with S3 fallback.
#
# Flow:
#   Pod 1: downloads from S3 via MX_FALLBACK_S3_PATH -> loads -> registers P2P source
#   Pod 2: discovers source -> RDMA transfer -> skips S3 entirely
#
# Deploy:
#   kubectl apply -f examples/p2p_transfer_k8s/ace-inference/vllm-mx-kimi.yaml
# Scale:
#   kubectl scale deploy mx-vllm-kimi -n ace-inference --replicas=2
apiVersion: v1
kind: Service
metadata:
  name: mx-vllm-kimi
  namespace: ace-inference
  labels:
    app: mx-vllm-kimi
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mx-vllm-kimi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-vllm-kimi
  namespace: ace-inference
  labels:
    app: mx-vllm-kimi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mx-vllm-kimi
  template:
    metadata:
      labels:
        app: mx-vllm-kimi
    spec:
      serviceAccountName: modelexpress
      initContainers:
        - name: downloader
          image: accel-registry.cwcr.cloud/cw4637/vllm-mx:v2.4.0-mx0.3.0
          imagePullPolicy: Always
          command: ["python3", "/root/scripts/downloader.py"]
          args:
            - "s3://infr/raw/nvidia/Kimi-K2.5-NVFP4/e4e908c073784de20ad3af0be653421f1088922d"
            - "/tmp/nvidia/Kimi-K2.5-NVFP4"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: obj-config
              mountPath: /root/.aws
          env:
            - name: AWS_ENDPOINT_URL
              value: "http://cwlota.com"
      containers:
        - name: vllm
          image: accel-registry.cwcr.cloud/cw4637/vllm-mx:v2.4.0-mx0.3.0
          imagePullPolicy: Always
          command: ["vllm", "serve"]
          args:
            - --model=/tmp/nvidia/Kimi-K2.5-NVFP4
            - --host=0.0.0.0
            - --port=8000
            - --served-model-name=nvidia/Kimi-K2.5-NVFP4
            - --load-format=mx
            - --tensor-parallel-size=4
            - --pipeline-parallel-size=1
            - --block-size=32
            - --gpu-memory-utilization=0.95
            - --max-model-len=8192
            - --max-num-batched-tokens=8192
            - --max-num-seqs=50
            - --trust-remote-code
            - --enable-auto-tool-choice
            - --reasoning-parser=kimi_k2
            - --tool-call-parser=kimi_k2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - IPC_LOCK
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # ModelExpress P2P
            - name: VLLM_PLUGINS
              value: "modelexpress"
            - name: MX_SERVER_ADDRESS
              value: "modelexpress-server:8001"
            - name: MX_CONTIGUOUS_REG
              value: "0"
            # S3 fallback — download from object storage if no P2P source
            - name: MX_FALLBACK_S3_PATH
              value: "s3://infr/raw/nvidia/Kimi-K2.5-NVFP4/e4e908c073784de20ad3af0be653421f1088922d"
            - name: AWS_ENDPOINT_URL
              value: "http://cwlota.com"
            # UCX/RDMA with Data Direct
            # UCX RDMA settings (tuned for this IB cluster)
            - name: UCX_TLS
              value: "rc_verbs,ud_verbs,cuda_copy,cuda_ipc"
            - name: UCX_IB_GPU_DIRECT_RDMA
              value: "yes"
            - name: UCX_CUDA_COPY_DMABUF
              value: "yes"
            - name: UCX_MAX_RMA_RAILS
              value: "4"
            - name: UCX_MAX_RNDV_RAILS
              value: "4"
            - name: NIXL_LOG_LEVEL
              value: "INFO"
            # Force UCX to re-detect CUDA memory type (fixes VRAM-as-host in subprocess)
            - name: UCX_MEMTYPE_CACHE
              value: "n"
            - name: UCX_MEM_MMAP_HOOK_MODE
              value: "none"
            # vLLM settings
            - name: VLLM_RPC_TIMEOUT
              value: "7200000"
            - name: OMP_NUM_THREADS
              value: "17"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            - name: NCCL_NVLS_ENABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/dev/shm/prom"
          resources:
            requests:
              nvidia.com/gpu: "4"
              rdma/ib: "1"
              memory: "256Gi"
              cpu: "40"
            limits:
              nvidia.com/gpu: "4"
              rdma/ib: "1"
              memory: "256Gi"
          # Probes removed — Kimi warmup can take 20+ minutes
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 100
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: prom-shm
              mountPath: /dev/shm/prom
            - name: tmp
              mountPath: /tmp
            - name: obj-config
              mountPath: /root/.aws
      nodeSelector:
        node.kubernetes.io/instance-type: gb200-4x-l
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: prom-shm
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
        - name: obj-config
          secret:
            defaultMode: 256
            secretName: k25-eagle3-inference-backends-obj-secret
